title: Diatom detection with oriented bounding boxes
summary: Diatoms detection with oriented bounding boxes.
description: "diamorph_detection is an application using the DEEPaaS API.\n\nIt is designed to predict oriented bounding boxes around diatoms. \nIt is based on a pre-trained yolov8 that has been finetuned on manually\nlabeled data.\n\nThis application only provides the inference endpoint.\n\n\n<img class='fit', src='https://raw.githubusercontent.com/ai4os-hub/diamorph-detection/main/data/val_batch.jpg'/>\n\n**History and contributors**\n\nThe project was initiated by the PhD of Aishwarya Venkataramanan using YoloV5 working on both detection and classification [1], cosupervized by Cédric Pradalier and Martin Laviale. At that time\nit was using axis aligned bounding boxes. Later, thanks to the support of PNRIA (Programme National de Recherche en Intelligence Artificielle) and the work\nof Cyril Regan, the code base was improved, the project was ported to Yolov5 with oriented bounding boxes and a web frontend added [2]. The project was finally ported\nto the iMagine platform with Yolov8 by Jeremy Fix.\n\nThe database used to train the Yolov8 is Cleurie/Orne, 2867 images, and 9822 instances annotated by Corentin Galinier and Martin Laviale. The running model is a pretrained Yolov8m-obb finetuned on the Cleurie/Orne dataset.\n\n**References**\n\n1. Aishwarya Venkataramanan. [Automatic identification of diatoms using deep learning to improve ecological diagnosis of aquatic environments](https://theses.hal.science/tel-04643505). Université de Lorraine, 2023. English.\n2. [https://www.ins2i.cnrs.fr/fr/diamorph-identification-automatique-des-diatomees-par-apprentissage-profond-partir-dimages](https://www.ins2i.cnrs.fr/fr/diamorph-identification-automatique-des-diatomees-par-apprentissage-profond-partir-dimages)"
